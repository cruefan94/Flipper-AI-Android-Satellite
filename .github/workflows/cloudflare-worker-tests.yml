name: Cloudflare Worker contract tests

on:
  # Owner-reviewed, per-run permission required; no unattended CI jobs.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker protocol and security checks
        run: node --test cloudflare_worker/test/*.test.mjs
