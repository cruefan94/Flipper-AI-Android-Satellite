name: Flipper AI Satellite — single combined APK verified build

on:
  pull_request:
    paths:
      - 'android_satellite/**'
      - '.github/workflows/phase2-android-verified-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flipper-ai-one-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Host regressions + one full-feature Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Check out the actual PR head; default GitHub PR merges have a different SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Verify and install Android SDK 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: One-time Android source, JVM and security regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 android_satellite/tools/preflight.py
          bash android_satellite/tests/run_core_tests.sh
          python3 -m unittest discover -s android_satellite/tests -p 'test_*.py' -v
      - name: Build one complete Flipper AI Satellite APK (debug, not an automatic upgrade)
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android_satellite --no-daemon --stacktrace \
            -PsatelliteVersionCode=${{ github.run_number }} :app:assembleDebug
          APK="android_satellite/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "name='com.flipperai.satellite' versionCode='${{ github.run_number }}'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'Flipper AI Satellite'"
          mkdir -p out
          # One uniquely named APK per GitHub run/attempt, easy to locate on phone.
          BUILD_DATE="$(date -u +%Y%m%d)"
          SHORT_SHA="$(git rev-parse --short=8 HEAD)"
          DOWNLOAD_LABEL="FlipperAI-Android_${BUILD_DATE}_run${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}_sha${SHORT_SHA}_ALLFEATURES-DEBUG-UNTESTED"
          cp "$APK" "out/${DOWNLOAD_LABEL}.apk"
          echo "APK_DOWNLOAD_LABEL=$DOWNLOAD_LABEL" >> "$GITHUB_ENV"
      - name: Generate fail-closed single APK integrity and provenance
        env:
          HEAD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          (cd out && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          output = pathlib.Path('out')
          binaries = list(output.glob('*.apk'))
          if len(binaries) != 1:
              raise SystemExit(f'Expected exactly one complete APK, found {len(binaries)}')
          binary = binaries[0]
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if source != os.environ['HEAD_SOURCE_SHA']:
              raise SystemExit('Checkout source differs from the requested PR head; refusing upload')
          data = binary.read_bytes()
          if not data:
              raise SystemExit('Empty Android package')
          evidence = {
              'schema': 2,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'built_checkout_sha': source,
              'pull_request_head_sha': os.environ['HEAD_SOURCE_SHA'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'version_code': int(os.environ['GITHUB_RUN_NUMBER']),
              'scope': 'CI compiled and signed-debug-package-verified; NOT tested on phone or Flipper',
              'variant_policy': 'one_combined_apk_only',
              'package': 'com.flipperai.satellite',
              'apk': {
                  'name': binary.name,
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              },
              'installation_notice': (
                  'Debug signature may differ from the installed app. '
                  'Do not uninstall the working app to force an upgrade: '
                  'app-private model data and preferences may be lost.'
              ),
          }
          (output / 'BUILD_EVIDENCE.json').write_text(
              json.dumps(evidence, sort_keys=True, indent=2) + '\n')
          PY
          echo 'Exactly ONE APK generated with ordinary Flipper AI Satellite identity.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Features are together in one app. Host tests and debug APK signature were verified.' >> "$GITHUB_STEP_SUMMARY"
          echo 'IMPORTANT: debug signing does NOT guarantee an upgrade over the installed app.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not uninstall the current phone app merely to install this build or lose its model data.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No cloud credentials, auto-install, production signing key, or hardware verification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure diagnostics only (no credentials)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Phase2-Android-CI-Diagnostics-UNTESTED
          path: |
            android_satellite/app/build/reports/**
            android_satellite/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the single combined Android APK and integrity report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_DOWNLOAD_LABEL }}
          path: out/
          if-no-files-found: error
          retention-days: 7
