name: Phase 2 Android Satellite — one tested three-variant CI bundle

on:
  pull_request:
    paths:
      - 'android_satellite/**'
      - '.github/workflows/phase2-android-verified-variants.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase2-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Host regressions + production/test/navtest isolated APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Verify and install Android SDK 35 build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: One-time Android source, JVM and security regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 android_satellite/tools/preflight.py
          bash android_satellite/tests/run_core_tests.sh
          python3 -m unittest discover -s android_satellite/tests -p 'test_*.py' -v
      - name: Build ordinary Satellite APK without stable release key
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android_satellite --no-daemon --stacktrace \
            -PsatelliteVersionCode=${{ github.run_number }} :app:assembleDebug
          APK="android_satellite/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "name='com.flipperai.satellite' versionCode='${{ github.run_number }}'"
          mkdir -p out
          cp "$APK" "out/FlipperAI-Satellite-DEBUG-UNTESTED.apk"
      - name: Build separate side-by-side test app (clean outputs)
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android_satellite --no-daemon --stacktrace \
            -PsatelliteVersionCode=${{ github.run_number }} \
            -PsatelliteSideBySide=true :app:clean :app:assembleDebug
          APK="android_satellite/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "name='com.flipperai.satellite.test' versionCode='${{ github.run_number }}'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'Flipper AI Satellite Test'"
          cp "$APK" "out/FlipperAI-Satellite-TEST-UNTESTED.apk"
      - name: Build separate BLE navigation app (clean outputs)
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android_satellite --no-daemon --stacktrace \
            -PsatelliteVersionCode=${{ github.run_number }} \
            -PsatelliteSideBySide=true -PsatelliteNavigationTest=true \
            :app:clean :app:assembleDebug
          APK="android_satellite/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "name='com.flipperai.satellite.navtest' versionCode='${{ github.run_number }}'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'Flipper AI BLE Nav Test'"
          cp "$APK" "out/FlipperAI-Satellite-BLE-NAV-UNTESTED.apk"
      - name: Generate fail-closed hashes and source identity
        env:
          HEAD_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          (cd out && sha256sum *.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          output = pathlib.Path('out')
          variants = {
              'ordinary': ('FlipperAI-Satellite-DEBUG-UNTESTED.apk', 'com.flipperai.satellite'),
              'side-by-side': ('FlipperAI-Satellite-TEST-UNTESTED.apk', 'com.flipperai.satellite.test'),
              'ble-navigation': ('FlipperAI-Satellite-BLE-NAV-UNTESTED.apk', 'com.flipperai.satellite.navtest'),
          }
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          evidence = {
              'schema': 1,
              'repository': os.environ['GITHUB_REPOSITORY'],
              'built_checkout_sha': source,
              'pull_request_head_sha': os.environ['HEAD_SOURCE_SHA'],
              'workflow_run': os.environ['GITHUB_RUN_ID'],
              'version_code': int(os.environ['GITHUB_RUN_NUMBER']),
              'scope': 'CI compiled and signed-debug-package-verified; NOT tested on phone or Flipper',
              'variants': {},
          }
          for key, (name, package) in variants.items():
              binary = output / name
              data = binary.read_bytes()
              if not data: raise SystemExit('Empty APK: ' + name)
              evidence['variants'][key] = {
                  'name': name, 'package': package, 'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          (output / 'BUILD_EVIDENCE.json').write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n')
          PY
          echo 'Three APK identities and signatures checked; tests ran once.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No cloud secrets, production signing material, automatic install, or hardware validation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload failure diagnostics only (no credentials)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Phase2-Android-CI-Diagnostics-UNTESTED
          path: |
            android_satellite/app/build/reports/**
            android_satellite/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload verified three-package test bundle
        uses: actions/upload-artifact@v4
        with:
          name: Phase2-Android-3-Variants-UNTESTED-${{ github.run_number }}-${{ github.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7
