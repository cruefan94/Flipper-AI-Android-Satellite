name: Android AI Satellite emulator launch smoke
on:
  workflow_dispatch:
  push:
    branches: [feature/android-emulator-smoke-v01]
    paths:
      - 'android_satellite/**'
      - '.github/workflows/android-emulator-smoke.yml'
permissions:
  contents: read
jobs:
  emulator-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build developer APK for emulator
        run: gradle -p android_satellite --no-daemon :app:assembleDebug
      - name: Install and start app on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            adb install -r android_satellite/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.flipperai.satellite/.MainActivity
            sleep 8
            adb shell pidof com.flipperai.satellite
            adb logcat -d -s AndroidRuntime:E > /tmp/ai-satellite-android-runtime-errors.log
            if grep -Fq 'FATAL EXCEPTION' /tmp/ai-satellite-android-runtime-errors.log; then
              cat /tmp/ai-satellite-android-runtime-errors.log
              exit 1
            fi
            echo "APK installed and MainActivity started; no AndroidRuntime fatal exception detected"
      - name: Report emulator test limits
        run: |
          echo 'Emulator startup smoke passed if prior step succeeded.'
          echo 'No compatible on-device .task model or Flipper Bluetooth hardware was tested.'
