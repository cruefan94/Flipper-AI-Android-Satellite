plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android { namespace 'com.flipperai.satellite'; compileSdk 35
 defaultConfig { applicationId 'com.flipperai.satellite'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.6.0-dev' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Official on-device LiteRT-LM engine; model weights are selected/imported separately.
dependencies { implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0' }
