plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android { namespace 'com.flipperai.satellite'; compileSdk 35
 defaultConfig { applicationId 'com.flipperai.satellite'; minSdk 26; targetSdk 35; versionCode 3; versionName '0.7.1-voice-preview' }
 // Temporary side-by-side test app: keep the already working offline-model
 // installation untouched when CI debug signing keys rotate between builds.
 buildTypes { debug { applicationIdSuffix '.voicepreview' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Official on-device LiteRT-LM engine; model weights are selected/imported separately.
dependencies { implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0' }
