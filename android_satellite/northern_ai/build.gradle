plugins {
    id 'com.android.application'
}

// Dedicated APK identity: never overwrites the Flipper AI Satellite installation.
def northernVersionCode = (findProperty('northernAiVersionCode') ?: '1').toString().toInteger()

android {
    namespace 'com.northerncircuitstudios.ai'
    compileSdk 35
    defaultConfig {
        applicationId 'com.northerncircuitstudios.ai'
        minSdk 26
        targetSdk 35
        versionCode northernVersionCode
        versionName '0.2.0-cloudtest'
        manifestPlaceholders = [northernAiAppLabel: 'Northern Circuit AI']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            applicationIdSuffix '.cloudtest'
            manifestPlaceholders = [northernAiAppLabel: 'Northern AI Cloud Test']
            minifyEnabled false
        }
    }
}
